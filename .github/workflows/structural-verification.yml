name: Structural certificate verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify CSV structure and exact coverage
        run: python tools/verify_certificate_csv.py data/certificates.csv
